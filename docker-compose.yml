services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000
    container_name: secure-rag-api
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      APP_ENV: production
      APP_NAME: ${APP_NAME:-Secure RAG}
      CONTEXT_MAX_CHARS: ${CONTEXT_MAX_CHARS:-12000}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?TRUSTED_HOSTS must be set}

      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}

      DEBUG: "false"

      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}

      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY must be set}
      LLM_BASE_URL: ${LLM_BASE_URL:?LLM_BASE_URL must be set}
      LLM_MODEL: ${LLM_MODEL:?LLM_MODEL must be set}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}

      INLINE_BACKGROUND_PROCESSING_ENABLED: ${INLINE_BACKGROUND_PROCESSING_ENABLED:-false}

      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-25}

      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-documents}
      QDRANT_URL: http://qdrant:6333

      QUERY_RATE_LIMIT_REQUESTS: ${QUERY_RATE_LIMIT_REQUESTS:-30}
      QUERY_RATE_LIMIT_WINDOW_SECONDS: ${QUERY_RATE_LIMIT_WINDOW_SECONDS:-60}

      RECONCILIATION_INTERVAL_SECONDS: ${RECONCILIATION_INTERVAL_SECONDS:-300}
      RECONCILIATION_STALE_DELETING_MINUTES: ${RECONCILIATION_STALE_DELETING_MINUTES:-30}
      RECONCILIATION_STALE_PROCESSING_MINUTES: ${RECONCILIATION_STALE_PROCESSING_MINUTES:-30}

      REDIS_URL: redis://redis:6379/0

      RERANKER_CANDIDATE_LIMIT: ${RERANKER_CANDIDATE_LIMIT:-10}
      RERANKER_MODEL: ${RERANKER_MODEL:-Xenova/ms-marco-MiniLM-L-6-v2}

      STORAGE_PATH: /app/storage/documents

      UPLOAD_RATE_LIMIT_REQUESTS: ${UPLOAD_RATE_LIMIT_REQUESTS:-10}
      UPLOAD_RATE_LIMIT_WINDOW_SECONDS: ${UPLOAD_RATE_LIMIT_WINDOW_SECONDS:-60}

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/ready',
          timeout=3
          )
      timeout: 5s
      interval: 10s
      retries: 10
      start_period: 120s

    ports:
      - "127.0.0.1:8001:8000"

    restart: unless-stopped

    volumes:
      - app_storage:/app/storage


  postgres:
    container_name: secure-rag-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      timeout: 5s
      interval: 5s
      retries: 10
      start_period: 5s

    image: postgres:16.15
    restart: unless-stopped

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  test-postgres:
    container_name: secure-rag-test-postgres

    profiles:
      - test

    environment:
      POSTGRES_DB: secure_rag_test
      POSTGRES_PASSWORD: secure_rag_test_dev
      POSTGRES_USER: secure_rag_test

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      timeout: 5s
      interval: 5s
      retries: 10
      start_period: 5s

    image: postgres:16.15

    ports:
      - "127.0.0.1:15433:5432"

    restart: "no"

    volumes:
      - test_postgres_data:/var/lib/postgresql/data


  qdrant:
    container_name: secure-rag-qdrant
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped

    ports:
      - "127.0.0.1:6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage


  test-qdrant:
    container_name: secure-rag-test-qdrant

    profiles:
      - test

    image: qdrant/qdrant:v1.19.1
    restart: "no"

    ports:
      - "127.0.0.1:16333:6333"

    volumes:
      - test_qdrant_data:/qdrant/storage


  redis:
    container_name: secure-rag-redis

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      timeout: 3s
      interval: 5s
      retries: 10

    image: redis:7.4.11-alpine3.21

    ports:
      - "127.0.0.1:6379:6379"

    restart: unless-stopped


  test-redis:
    container_name: secure-rag-test-redis

    profiles:
      - test

    image: redis:7.4.11-alpine3.21
    restart: "no"

    ports:
      - "127.0.0.1:16379:6379"


  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - python
      - -m
      - scripts.cron

    container_name: secure-rag-scheduler

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      APP_ENV: production
      APP_NAME: ${APP_NAME:-Secure RAG}
      CONTEXT_MAX_CHARS: ${CONTEXT_MAX_CHARS:-12000}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?TRUSTED_HOSTS must be set}

      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}

      DEBUG: "false"

      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}

      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-25}

      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-documents}
      QDRANT_URL: http://qdrant:6333

      RECONCILIATION_INTERVAL_SECONDS: ${RECONCILIATION_INTERVAL_SECONDS:-300}
      RECONCILIATION_STALE_DELETING_MINUTES: ${RECONCILIATION_STALE_DELETING_MINUTES:-30}
      RECONCILIATION_STALE_PROCESSING_MINUTES: ${RECONCILIATION_STALE_PROCESSING_MINUTES:-30}

      REDIS_URL: redis://redis:6379/0

      RERANKER_CANDIDATE_LIMIT: ${RERANKER_CANDIDATE_LIMIT:-10}
      RERANKER_MODEL: ${RERANKER_MODEL:-Xenova/ms-marco-MiniLM-L-6-v2}

      STORAGE_PATH: /app/storage/documents

    restart: unless-stopped

    volumes:
      - app_storage:/app/storage


  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - python
      - -m
      - scripts.worker

    container_name: secure-rag-worker

    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy

    environment:
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      APP_ENV: production
      APP_NAME: ${APP_NAME:-Secure RAG}
      CONTEXT_MAX_CHARS: ${CONTEXT_MAX_CHARS:-12000}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?TRUSTED_HOSTS must be set}

      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}

      DEBUG: "false"

      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}

      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY must be set}
      LLM_BASE_URL: ${LLM_BASE_URL:?LLM_BASE_URL must be set}
      LLM_MODEL: ${LLM_MODEL:?LLM_MODEL must be set}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}

      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-25}

      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-documents}
      QDRANT_URL: http://qdrant:6333

      RECONCILIATION_INTERVAL_SECONDS: ${RECONCILIATION_INTERVAL_SECONDS:-300}
      RECONCILIATION_STALE_DELETING_MINUTES: ${RECONCILIATION_STALE_DELETING_MINUTES:-30}
      RECONCILIATION_STALE_PROCESSING_MINUTES: ${RECONCILIATION_STALE_PROCESSING_MINUTES:-30}

      REDIS_URL: redis://redis:6379/0

      RERANKER_CANDIDATE_LIMIT: ${RERANKER_CANDIDATE_LIMIT:-10}
      RERANKER_MODEL: ${RERANKER_MODEL:-Xenova/ms-marco-MiniLM-L-6-v2}

      STORAGE_PATH: /app/storage/documents

    restart: unless-stopped

    volumes:
      - app_storage:/app/storage


  prometheus:
    container_name: secure-rag-prometheus

    image: prom/prometheus:v3.14.0

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus

    depends_on:
      api:
        condition: service_healthy

    ports:
      - "127.0.0.1:9090:9090"

    restart: unless-stopped

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro,Z
      - prometheus_data:/prometheus


  grafana:
    container_name: secure-rag-grafana

    image: grafana/grafana:13.2.1

    depends_on:
      prometheus:
        condition: service_started

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"

    ports:
      - "127.0.0.1:3000:3000"

    restart: unless-stopped

    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./monitoring/grafana/dashboard.json:/var/lib/grafana/dashboards/secure-rag-operations.json:ro,Z
      - grafana_data:/var/lib/grafana


volumes:
  app_storage:
    name: secure-rag_app_storage

  postgres_data:
    name: secure-rag_postgres_data

  qdrant_data:
    name: secure-rag_qdrant_data

  test_postgres_data:
    name: secure-rag_test_postgres_data

  test_qdrant_data:
    name: secure-rag_test_qdrant_data

  prometheus_data:
    name: secure-rag_prometheus_data

  grafana_data:
    name: secure-rag_grafana_data
