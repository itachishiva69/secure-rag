services:
  api:
    build:
      context: /home/shiva/Projects/secure-rag
      dockerfile: Dockerfile

    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000

    container_name: secure-rag-api

    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy

    environment:
      ACCESS_TOKEN_EXPIRE_MINUTES: "120"
      APP_ENV: production
      APP_NAME: Secure RAG
      CONTEXT_MAX_CHARS: "12000"

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS}

      DATABASE_URL: postgresql+psycopg://secure_rag:<your-existing-database-password>@postgres:5432/secure_rag

      DEBUG: "false"

      JWT_ALGORITHM: HS256
      JWT_SECRET: <generate-a-new-random-64-byte-value>

      LLM_API_KEY: <your-current-groq-key>
      LLM_BASE_URL: https://api.groq.com/openai/v1
      LLM_MODEL: openai/gpt-oss-120b
      LLM_TIMEOUT_SECONDS: "30"

      MAX_UPLOAD_SIZE_MB: "25"

      QDRANT_COLLECTION: documents
      QDRANT_URL: http://qdrant:6333

      QUERY_RATE_LIMIT_REQUESTS: "30"
      QUERY_RATE_LIMIT_WINDOW_SECONDS: "60"

      RECONCILIATION_INTERVAL_SECONDS: "300"
      RECONCILIATION_STALE_DELETING_MINUTES: "30"
      RECONCILIATION_STALE_PROCESSING_MINUTES: "30"

      REDIS_URL: redis://redis:6379/0

      RERANKER_CANDIDATE_LIMIT: "10"
      RERANKER_MODEL: cross-encoder/ms-marco-MiniLM-L6-v2

      STORAGE_PATH: /app/storage/documents

      UPLOAD_RATE_LIMIT_REQUESTS: "10"
      UPLOAD_RATE_LIMIT_WINDOW_SECONDS: "60"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/health',
          timeout=3
          )
      timeout: 5s
      interval: 10s
      retries: 10
      start_period: 15s

    ports:
      - "127.0.0.1:8001:8000"

    restart: unless-stopped

    volumes:
      - app_storage:/app/storage


  postgres:
    container_name: secure-rag-postgres

    environment:
      POSTGRES_DB: secure_rag
      POSTGRES_PASSWORD: <your-existing-database-password>
      POSTGRES_USER: secure_rag

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      timeout: 5s
      interval: 5s
      retries: 10
      start_period: 5s

    image: postgres:16

    restart: unless-stopped

    volumes:
      - postgres_data:/var/lib/postgresql/data


  qdrant:
    container_name: secure-rag-qdrant

    image: qdrant/qdrant:latest

    restart: unless-stopped

    volumes:
      - qdrant_data:/qdrant/storage


  redis:
    container_name: secure-rag-redis

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      timeout: 3s
      interval: 5s
      retries: 10

    image: redis:7-alpine

    restart: unless-stopped


  scheduler:
    build:
      context: /home/shiva/Projects/secure-rag
      dockerfile: Dockerfile

    command:
      - python
      - -m
      - scripts.cron

    container_name: secure-rag-scheduler

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      ACCESS_TOKEN_EXPIRE_MINUTES: "120"
      APP_ENV: production
      APP_NAME: Secure RAG
      CONTEXT_MAX_CHARS: "12000"

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS}

      DATABASE_URL: postgresql+psycopg://secure_rag:<your-existing-database-password>@postgres:5432/secure_rag

      DEBUG: "false"

      JWT_ALGORITHM: HS256
      JWT_SECRET: <generate-a-new-random-64-byte-value>

      MAX_UPLOAD_SIZE_MB: "25"

      QDRANT_COLLECTION: documents
      QDRANT_URL: http://qdrant:6333

      RECONCILIATION_INTERVAL_SECONDS: "300"
      RECONCILIATION_STALE_DELETING_MINUTES: "30"
      RECONCILIATION_STALE_PROCESSING_MINUTES: "30"

      REDIS_URL: redis://redis:6379/0

      RERANKER_CANDIDATE_LIMIT: "10"
      RERANKER_MODEL: cross-encoder/ms-marco-MiniLM-L6-v2

      STORAGE_PATH: /app/storage/documents

    restart: unless-stopped

    volumes:
      - app_storage:/app/storage


  worker:
    build:
      context: /home/shiva/Projects/secure-rag
      dockerfile: Dockerfile

    command:
      - python
      - -m
      - scripts.worker

    container_name: secure-rag-worker

    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy

    environment:
      ACCESS_TOKEN_EXPIRE_MINUTES: "120"
      APP_ENV: production
      APP_NAME: Secure RAG
      CONTEXT_MAX_CHARS: "12000"

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS}

      DATABASE_URL: postgresql+psycopg://secure_rag:<your-existing-database-password>@postgres:5432/secure_rag

      DEBUG: "false"

      JWT_ALGORITHM: HS256
      JWT_SECRET: <generate-a-new-random-64-byte-value>

      MAX_UPLOAD_SIZE_MB: "25"

      QDRANT_COLLECTION: documents
      QDRANT_URL: http://qdrant:6333

      RECONCILIATION_INTERVAL_SECONDS: "300"
      RECONCILIATION_STALE_DELETING_MINUTES: "30"
      RECONCILIATION_STALE_PROCESSING_MINUTES: "30"

      REDIS_URL: redis://redis:6379/0

      RERANKER_CANDIDATE_LIMIT: "10"
      RERANKER_MODEL: cross-encoder/ms-marco-MiniLM-L6-v2

      STORAGE_PATH: /app/storage/documents

    restart: unless-stopped

    volumes:
      - app_storage:/app/storage


networks:
  default:
    name: secure-rag_default


volumes:
  app_storage:
    name: secure-rag_app_storage

  postgres_data:
    name: secure-rag_postgres_data

  qdrant_data:
    name: secure-rag_qdrant_data